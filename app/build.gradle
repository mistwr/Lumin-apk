}

android {
    namespace 'com.lumin.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumin.app"
        minSdk 26
        targetSdk 34
        versionCode 622
        versionName "6.2.2"

        // Public Supabase connection details can safely ship in the client.
        // User access is protected by Supabase Auth/RLS and short-lived session JWTs.
        buildConfigField "String", "SUPABASE_URL", '"https://yqninaripblwhcfcwwnr.supabase.co"'
        buildConfigField "String", "SUPABASE_ANON_KEY", '"sb_publishable_zlhSNpfeS3gjBDPsxOPiCQ_DYkKwgb_"'
        buildConfigField "String", "SUPABASE_ACCESS_TOKEN", '""'
        buildConfigField "String", "QWEN_ENDPOINT", '"' + (project.findProperty("SOFIA_QWEN_ENDPOINT") ?: "http://127.0.0.1:11434/api/generate") + '"'
        buildConfigField "String", "MYPOUPAR_SUPABASE_URL", '"https://lblnhttwadvofhkhkbsv.supabase.co"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
