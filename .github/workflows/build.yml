name: Build SOFIA Android

on:
  push:
    branches: [ main, sofia-build53, sofia-build53-hotfix, sofia-build53-2, sofia-build54-console, sofia-build54-1-recover, sofia-build55-1-overlay-hide, sofia-build56-1-local-llama ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        env:
          SOFIA_SUPABASE_URL: ${{ secrets.SOFIA_SUPABASE_URL }}
          SOFIA_SUPABASE_ANON_KEY: ${{ secrets.SOFIA_SUPABASE_ANON_KEY }}
          SOFIA_SUPABASE_ACCESS_TOKEN: ${{ secrets.SOFIA_SUPABASE_ACCESS_TOKEN }}
          SOFIA_QWEN_ENDPOINT: ${{ secrets.SOFIA_QWEN_ENDPOINT }}
        run: |
          gradle assembleDebug \
            -PSOFIA_SUPABASE_URL="$SOFIA_SUPABASE_URL" \
            -PSOFIA_SUPABASE_ANON_KEY="$SOFIA_SUPABASE_ANON_KEY" \
            -PSOFIA_SUPABASE_ACCESS_TOKEN="$SOFIA_SUPABASE_ACCESS_TOKEN" \
            -PSOFIA_QWEN_ENDPOINT="${SOFIA_QWEN_ENDPOINT:-http://127.0.0.1:11434/api/generate}"
      - uses: actions/upload-artifact@v4
        with:
          name: SOFIA-Build56-1-LocalBrain-APK
          path: app/build/outputs/apk/debug/app-debug.apk
