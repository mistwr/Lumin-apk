[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TWILIO_ENDPOINT=PJSIP/twilio
OUTBOUND_CLI=__TWILIO_CALLER_ID_E164__

; Twilio PSTN -> Asterisk -> REBORN VoiceBridge (ARI/Stasis).
[from-twilio]
exten => _X.,1,NoOp(REBORN AI inbound from Twilio: ${CALLERID(all)} -> ${EXTEN})
 same => n,Set(CHANNEL(language)=pt)
 same => n,Answer()
 same => n,Stasis(voicebot,${EXTEN})
 same => n,Hangup()

; REBORN local SIP endpoint -> Twilio PSTN (manual/softphone path).
[from-reborn]
exten => _+X.,1,NoOp(REBORN outbound E164 ${EXTEN})
 same => n,Set(CALLERID(num)=${OUTBOUND_CLI})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${OUTBOUND_CLI}@__TWILIO_TRUNK_DOMAIN__>)
 same => n,Dial(${TWILIO_ENDPOINT}/sip:${EXTEN}@__TWILIO_TRUNK_DOMAIN__,60,b)
 same => n,Hangup()

; Portugal convenience: 9-digit PT number -> +351xxxxxxxxx
exten => _XXXXXXXXX,1,Goto(from-reborn,+351${EXTEN},1)

; Health test from a registered REBORN SIP endpoint.
exten => 6000,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; Direct AI entry for local tests.
[reborn-ai]
exten => _X.,1,NoOp(REBORN AI bridge entry ${EXTEN})
 same => n,Set(CHANNEL(language)=pt)
 same => n,Answer()
 same => n,Stasis(voicebot,${EXTEN})
 same => n,Hangup()
