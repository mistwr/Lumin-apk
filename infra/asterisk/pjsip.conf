; REBORN AI / Twilio Elastic SIP Trunking
; Replace the __...__ placeholders before copying to /etc/asterisk/pjsip.conf
;
; Twilio termination domain example:
;   reborn-ai.pstn.twilio.com
;
; For production prefer TLS/SRTP. This first profile uses UDP so we can validate
; call routing quickly, then harden it once signalling/media are proven.

[global]
type=global
user_agent=REBORN-AI-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=__ASTERISK_PUBLIC_IP__
external_media_address=__ASTERISK_PUBLIC_IP__
local_net=__ASTERISK_LOCAL_NET__

; ---------- Twilio outbound authentication ----------
[twilio-auth]
type=auth
auth_type=userpass
username=__TWILIO_SIP_USERNAME__
password=__TWILIO_SIP_PASSWORD__

[twilio-aor]
type=aor
contact=sip:__TWILIO_TRUNK_DOMAIN__:5060
qualify_frequency=30

[twilio]
type=endpoint
transport=transport-udp
context=from-twilio
disallow=all
allow=ulaw
allow=alaw
outbound_auth=twilio-auth
aors=twilio-aor
from_domain=__TWILIO_TRUNK_DOMAIN__
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes

; Match Twilio origination signalling. Use the actual Twilio signalling CIDRs
; for the edge/region selected in the Twilio Console.
[twilio-identify-1]
type=identify
endpoint=twilio
match=__TWILIO_SIGNALING_CIDR_1__

[twilio-identify-2]
type=identify
endpoint=twilio
match=__TWILIO_SIGNALING_CIDR_2__

; ---------- Local REBORN SIP endpoint ----------
; This gives us a clean endpoint for softphone/WebRTC/native SIP experiments.
[reborn-auth]
type=auth
auth_type=userpass
username=reborn
password=__REBORN_SIP_PASSWORD__

[reborn-aor]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=20

[reborn]
type=endpoint
transport=transport-udp
context=from-reborn
disallow=all
allow=ulaw
allow=alaw
auth=reborn-auth
aors=reborn-aor
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes
